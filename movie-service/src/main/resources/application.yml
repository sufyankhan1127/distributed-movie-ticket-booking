
server:
  port: 8082

spring:
  application:
    name: movie-service

  datasource:
    url: jdbc:mysql://localhost:3307/movie_booking
    username: movieapp
    password: movieapppassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

